

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlite-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-backend-deployment
  labels:
    app: restaurant-backend
spec:
  replicas: 1 # مقصودة 1 وليست أكثر لأننا نستخدم SQLite كقاعدة بيانات محلية لا تدعم الكتابة المتزامنة من عدة Pods.
  selector:
    matchLabels:
      app: restaurant-backend
  template:
    metadata:
      labels:
        app: restaurant-backend
    spec:
      # --- بداية التعديل: إضافة حاوية التهيئة لقاعدة البيانات ---
      initContainers:
      - name: prisma-migration
        image: docker.io/rebal1sh/restaurant-backend:latest
        imagePullPolicy: Always
        command: ["npx", "prisma", "db", "push", "--accept-data-loss"]
        env:
        - name: DATABASE_URL
          value: "file:/app/data/dev.db" 
        volumeMounts:
        - name: sqlite-storage
          mountPath: /app/data
      # --- نهاية التعديل ---
      containers:
      - name: backend-container
        image: docker.io/rebal1sh/restaurant-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3005
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3005"
        - name: DATABASE_URL
          value: "file:/app/data/dev.db" 
        - name: ADMIN_USERNAME
          value: "admin"
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: ADMIN_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: JWT_SECRET
        - name: EMAIL_HOST
          value: "smtp.gmail.com"
        - name: EMAIL_PORT
          value: "587"
        - name: EMAIL_SECURE
          value: "false"
        - name: EMAIL_USER
          value: "mhd.mosrafa@gmail.com"
        - name: EMAIL_PASS
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: EMAIL_PASS
        - name: BASE_URL
          value: "http://localhost:3005"
        volumeMounts:
        - name: sqlite-storage
          mountPath: /app/data
      volumes:
      - name: sqlite-storage
        persistentVolumeClaim:
          claimName: sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: LoadBalancer
  selector:
    app: restaurant-backend
  ports:
    - protocol: TCP
      port: 3005
      targetPort: 3005