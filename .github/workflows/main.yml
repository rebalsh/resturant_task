name: CI Pipeline - Build and Push to Docker Hub

# تشغيل الأتمتة تلقائياً عند عمل push لفرع main فقط
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من الجيت هاب إلى سيرفر البناء الافتراضي
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. تسجيل الدخول إلى Docker Hub باستخدام الـ Secrets التي أضفناها
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets::DOCKER_USERNAME }}
        password: ${{ secrets::DOCKER_PASSWORD }}

    # 3. بناء صورة الباك إيند ورفعها تلقائياً
    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend # تحديد مجلد الباك إيند الخاص بك
        file: ./backend/Dockerfile
        push: true
        tags: rebal1sh/restaurant-backend:latest

    # 4. بناء صورة الفرونت إيند ورفعها تلقائياً
    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./front_end # تحديد مجلد الفرونت إيند الخاص بك
        file: ./front_end/Dockerfile
        push: true
        tags: rebal1sh/restaurant-frontend:latest