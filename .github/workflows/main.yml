name: CI Pipeline - Build and Push to Docker Hub

on:
  push:
    branches:
      - main
      - master # أضفنا master كاحتمال احتياطي إذا كان فرعك ليس main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: rebal1sh/restaurant-backend:latest

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./front_end
        file: ./front_end/Dockerfile
        push: true
        tags: rebal1sh/restaurant-frontend:latest